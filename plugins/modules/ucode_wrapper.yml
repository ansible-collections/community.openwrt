DOCUMENTATION:
  module: ucode_wrapper
  short_description: Internal wrapper module for OpenWrt ucode-based modules
  version_added: "1.9.0"
  description:
    - This is an internal module used by the OpenWrt collection's action plugins.
    - It serves as a runtime wrapper that executes ucode-based module scripts.
    - End users should not call this module directly.
    - The action plugins transfer the target module and its helper libraries into a shared
      temporary directory before invoking this wrapper.
  options: {}
  notes:
    - This module is part of the internal implementation of the community.openwrt collection.
    - It should not be invoked directly in playbooks.
    - All ucode-based OpenWrt modules use this wrapper mechanism internally.
  author:
    - Alexei Znamensky (@russoz)

EXAMPLES: |
  # This module is not intended to be used directly in playbooks.
  # It is invoked automatically by action plugins.
