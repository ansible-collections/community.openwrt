DOCUMENTATION:
  module: wg_interface
  version_added: "1.10.0"
  short_description: Manage WireGuard/AmneziaWG identity keys, interface UCI sections and WAN ingress firewall rules
  description:
    - Manages WireGuard/AmneziaWG identity keys, interface UCI sections and the WAN
      ingress firewall rule for each interface's listen port.
    - "The module performs the following steps in order:"
    - "1. Determine the protocol (V(wireguard) by default) and the ubus key server from the configured interfaces."
    - "2. Resolve the host identity key, reading it from every interface in O(managed_interfaces), failing on a hard mismatch (two distinct keys), otherwise reusing the single existing key or generating a fresh one via ubus, and deriving and reporting the public key."
    - "3. Apply the identity key to every interface in O(managed_interfaces) (propagating it to interfaces missing one, or a fresh key on O(force_rekey=true))."
    - "4. Remove interfaces whose O(interfaces[].state) or O(state) is V(absent), dropping the interface section, its peer sections and its WAN ingress rule."
    - "5. Write each interface UCI section, including AWG 3.x/3.1 options when O(proto=amneziawg), and ensure the WAN ingress ACCEPT rule for its listen port (unless O(manage_firewall=false))."
    - "6. Resolve or generate a pre-shared key for each entry in O(peers), reusing an existing on-device PSK or generating one with the ubus C(genpsk) method, and return them in RV(psks), in the same order as O(peers)."
    - For the available WireGuard UCI config options see U(https://openwrt.org/docs/guide-user/services/vpn/wireguard/start).
    - "AmneziaWG support relies on the C(amneziawg) ubus key server; see Requirements below."
  attributes:
    check_mode:
      support: full
    diff_mode:
      support: full
    platform:
      description: Target platform for this module.
      support: full
      platforms: OpenWrt
  options:
    proto:
      description:
        - Module-wide protocol, used as the default for every entry in O(interfaces)
          and O(peers) whose own O(interfaces[].proto) or O(peers[].proto) is not set.
        - An explicitly-set O(interfaces[].proto) or O(peers[].proto) overrides this for that entry.
      type: str
      choices: [wireguard, amneziawg]
      default: wireguard
    state:
      description:
        - Module-wide state, used as the default for every entry in O(interfaces)
          whose own O(interfaces[].state) is not set.
        - An explicitly-set O(interfaces[].state) overrides this for that interface.
      type: str
      choices: [present, absent]
      default: present
    managed_interfaces:
      description:
        - Names of all the interfaces on the host that share the host identity key.
        - The module reads the private key from each of them, fails if they hold different keys
          (unless O(force_rekey=true)), and writes the identity key to those missing one.
        - Use it when O(interfaces) does not list every interface of the host, for instance when
          a play run with C(--tags) configures only one point-to-point link out of several. Listing
          all of them here keeps that link on the same key as the others.
        - When not given, it is derived from O(interfaces), from the entries whose state is not
          V(absent). So when O(interfaces) already lists every interface of the host, or when each
          interface may have its own key, this option can be omitted.
        - A run that only removes interfaces, with this option not given, does no key management.
      type: list
      elements: str
    interfaces:
      description:
        - List of interface configurations to (re)write.
      type: list
      elements: dict
      required: true
      suboptions:
        name:
          description:
            - Interface name.
          type: str
          required: true
        state:
          description:
            - Whether the interface should be present or absent.
            - When V(absent), the interface section, its peer sections and its WAN ingress
              rule are removed.
            - Defaults to the module-wide O(state) when not set.
          type: str
          choices: [present, absent]
        proto:
          description:
            - Interface protocol.
            - Defaults to the module-wide O(proto) when not set.
          type: str
          choices: [wireguard, amneziawg]
        listen_port:
          description:
            - Interface listen port.
          type: int
        addresses:
          description:
            - List of addresses with prefix (v4/v6).
          type: list
          elements: str
        mtu:
          description:
            - Interface MTU.
          type: int
        metric:
          description:
            - Interface metric.
          type: int
        dns:
          description:
            - List of DNS servers advertised for the interface (OpenWrt C(dns) option).
          type: list
          elements: str
        peerdns:
          description:
            - Whether to accept DNS servers provided by this interface (OpenWrt C(peerdns) option).
          type: bool
        dns_metric:
          description:
            - DNS metric for the interface (OpenWrt C(dns_metric) option).
          type: int
        awg_tuning:
          description:
            - AmneziaWG tuning and 3.x/3.1 options (C(awg_*) keys) applied verbatim.
            - Only meaningful when the interface protocol is V(amneziawg); ignored for V(wireguard).
          type: dict
    force_rekey:
      description:
        - Regenerate the identity key even if one exists.
        - When V(true), the module is not idempotent and always reports a change.
      type: bool
      default: false
    force_psk_rekey:
      description:
        - Regenerate every peer PSK even if one already exists on-device.
        - When V(true), the module is not idempotent and always reports a change.
      type: bool
      default: false
    manage_firewall:
      description:
        - Whether to (re)write the WAN ingress ACCEPT rule for each interface listen port.
        - Set to V(false) when firewall management is handled elsewhere.
      type: bool
      default: true
    firewall_rule_id_template:
      description:
        - Ucode template for the UCI section id of the WAN ingress firewall rule.
        - "Rendered with these variables in scope: C(iface_name) (O(interfaces[].name)),
          C(proto) (O(interfaces[].proto) or O(proto)) and C(listen_port) (O(interfaces[].listen_port))."
      type: str
      default: "{{ iface_name }}_in"
    firewall_rule_name_template:
      description:
        - Ucode template for the C(name)/description of the WAN ingress firewall rule.
        - "Rendered with these variables in scope: C(iface_name) (O(interfaces[].name)),
          C(proto) (O(interfaces[].proto) or O(proto)) and C(listen_port) (O(interfaces[].listen_port))."
      type: str
      default: "Allow-Wan-{{ proto }}: {{ iface_name }}"
    peer_id_template:
      description:
        - Ucode template for the peer UCI section id, used to locate a reusable on-device
          pre-shared key for idempotency.
        - "Rendered with these variables in scope: C(iface_name) (O(peers[].iface)),
          C(section) (O(peers[].section)) and C(proto) (O(peers[].proto) or O(proto))."
        - Must render the same id as O(community.openwrt.wg_peer#module:peer_id_template).
      type: str
      default: "{% if (section): %}peer_{{ iface_name }}_{{ section }}{% else %}peer_{{ iface_name }}{% endif %}"
    peers:
      description:
        - "Optional list of peer section skeletons. For each, the module resolves (but does not store) the pre-shared key: it reuses an existing on-device PSK or generates one with the ubus C(genpsk) method."
        - Resolved keys are returned in RV(psks), in the same order as this list, so the controller
          can distribute each shared key to both ends.
      type: list
      elements: dict
      suboptions:
        iface:
          description:
            - Parent interface name.
          type: str
          required: true
        section:
          description:
            - Peer section suffix, available as C(section) in the O(peer_id_template) template
              scope when resolving the pre-shared key.
          type: str
        proto:
          description:
            - Peer protocol.
            - Defaults to the module-wide O(proto) when not set.
          type: str
          choices: [wireguard, amneziawg]
        force_psk_rekey:
          description:
            - Regenerate this peer PSK even if one already exists.
          type: bool
          default: false
  requirements:
    - C(rpcd) must be running (default behavior in standard OpenWrt).
    - C(rpcd-mod-wireguard).
    - The custom module C(rpcd-mod-amneziawg) for AmneziaWG, from U(https://github.com/vooon/wgsd-ucode/tree/main/rpcd-mod-amneziawg).
  notes:
    - The module writes UCI configuration only; it does not bring the interface up nor
      establish tunnels.
    - The identity key and peer PSKs are generated via ubus; the C(wireguard) object is used
      as a fallback when the requested C(amneziawg) object is not available.
    - >-
      It is an intended design decision that all managed interfaces on a host share the same private key (and therefore the same public key),
      while each peer gets its own distinct pre-shared key.
      This keeps monitoring and peer mapping simple.
      The host is identified by one public key, and every peer link is identified by its unique PSK.
    - Template options (C(*_template)) use ucode's native template engine (Jinja-style
      C({{ ... }}) / C({% ... %})).
    - This module is not tested on OpenWrt 23.05, which has no C(rpcd-mod-wireguard) package.
  extends_documentation_fragment:
    - community.openwrt.attributes
  author:
    - Vladimir Ermakov (@vooon)

EXAMPLES: |
  # Hub: resolve/write the identity key and a hub interface section, then
  # generate a per-spoke peer PSK for each of the two spokes
  - community.openwrt.wg_interface:
      managed_interfaces: [wg0]
      interfaces:
        - name: wg0
          proto: wireguard
          listen_port: 51820
          addresses:
            - "10.8.0.1/24"
      peers:
        - iface: wg0
          section: spoke1
        - iface: wg0
          section: spoke2

  # Two independent p2p links on one host: each link is its own interface with
  # its own listen port, identity key (shared host-wide) and per-link peer PSK
  - community.openwrt.wg_interface:
      managed_interfaces: [wg_l1, wg_l2]
      interfaces:
        - name: wg_l1
          proto: wireguard
          listen_port: 51821
          addresses:
            - "10.9.0.1/30"
        - name: wg_l2
          proto: wireguard
          listen_port: 51822
          addresses:
            - "10.10.0.1/30"
      peers:
        - iface: wg_l1
        - iface: wg_l2

RETURN:
  public_key:
    description: Host identity public key.
    returned: always
    type: str
  interfaces:
    description: Names of (re)written interface sections.
    returned: always
    type: list
    elements: str
  psks:
    description:
      - Resolved (not stored) peer pre-shared keys, as a list parallel to O(peers)
        (O(psks[i]) is the key for O(peers[i])). The controller zips the two lists to
        distribute each shared key to both ends.
    returned: when O(peers) is given
    type: list
    elements: str
  firewall_changed:
    description: True if any WAN ingress firewall rule was created or modified.
    returned: always
    type: bool
  removed_interfaces:
    description: Names of interfaces removed because their O(interfaces[].state) was V(absent).
    returned: when any interface state is absent
    type: list
    elements: str
