DOCUMENTATION:
  module: apk
  short_description: Manage packages with apk on OpenWrt
  description:
    - The M(community.openwrt.apk) module manages packages on OpenWrt using the apk package manager (available in OpenWrt
      25.12+).
    - It can install and remove packages.
  author: Krzysztof Bialek (@kbialek)
  version_added: 0.4.0
  extends_documentation_fragment:
    - community.openwrt.attributes
  attributes:
    check_mode:
      support: full
    diff_mode:
      support: none
  options:
    name:
      description:
        - Name of the package(s) to install or remove.
        - Multiple packages can be specified as a list, or as a comma-separated string, for example V(curl,wget).
        - Before community.openwrt 1.9.0, this option was of type C(str) and spaces around the commas were not allowed.
      type: list
      elements: str
      required: true
      aliases:
        - pkg
    state:
      description:
        - Whether the package should be installed or removed.
        - V(latest) installs the package, or upgrades it when a newer version is available.
          Set O(update_cache=true) for the newest versions in the package feeds to be known.
          In check mode, the package cache is not updated.
        - "Warning: Upgrading packages included in the OpenWrt firmware is strongly discouraged.
          This can lead to package incompatibilities and an unstable or broken system.
          See U(https://openwrt.org/meta/infobox/upgrade_packages_warning) for details."
        - V(latest) was added in community.openwrt 1.11.0.
      type: str
      choices:
        - absent
        - installed
        - latest
        - present
        - removed
      default: present
    update_cache:
      description:
        - Update the package cache (C(apk update)) before performing the operation. Mutually exclusive with (O(no_cache)).
      type: bool
      default: false
    no_cache:
      description:
        - Do not use a local cache files, fetch from index directly. Mutually exclusive with (O(update_cache)).
      type: bool
      default: false
    force_broken_world:
      description:
        - Continue even if package dependencies are broken.
      type: bool
      default: false
    allow_untrusted:
      description:
        - To install a locally available apk package, for example if this device has no internet access but you can upload apk packages directly to it.
      type: bool
      default: false
      version_added: 1.5.0
  notes:
    - Starting with version 1.9.0 of this collection, this module is implemented in C(ucode).

EXAMPLES: |
  - name: Install a package
    community.openwrt.apk:
      name: vim
      state: present

  - name: Remove a package
    community.openwrt.apk:
      name: vim
      state: absent

  - name: Update cache and install multiple packages
    community.openwrt.apk:
      name:
        - curl
        - wget
      state: present
      update_cache: true

  - name: Update cache and upgrade packages to their latest versions
    community.openwrt.apk:
      name:
        - curl
        - wget
      state: latest
      update_cache: true

  - name: Install package without using local cache
    community.openwrt.apk:
      name: tcpdump
      state: present
      no_cache: true

  - name: Install local package
    community.openwrt.apk:
      name: /path/to/file.apk
      state: present
      allow_untrusted: true

RETURN: {}
