DOCUMENTATION:
  module: wg_peer
  version_added: "1.9.0"
  short_description: Manage WireGuard/AmneziaWG peer UCI sections
  description:
    - Writes WireGuard/AmneziaWG peer UCI sections for an interface.
    - Takes the peer's resolved key material (public key, optional PSK, endpoint) from
      controller facts; the interface itself must already exist (see M(community.openwrt.wg_interface)).
    - Implemented in ucode and run directly on the OpenWrt target.
  attributes:
    check_mode:
      support: full
    diff_mode:
      support: full
    platform:
      description: Target platform for this module.
      support: full
      platforms: OpenWrt
  options:
    proto:
      description:
        - Module-wide protocol, used as the default for every peer whose own C(proto)
          is not set.
        - Falls back to the interface section's C(proto) (then C(wireguard)) when the
          peer's C(proto) and this option are both unset.
      type: str
      choices: [wireguard, amneziawg]
    state:
      description:
        - Module-wide state, used as the default for every peer whose own C(state)
          is not set.
        - An explicitly-set C(state) on an individual peer overrides this.
      type: str
      choices: [present, absent]
      default: present
    peers:
      description:
        - List of peer configurations to write.
      type: list
      elements: dict
      required: true
      suboptions:
        iface:
          description:
            - Parent interface name.
          type: str
          required: true
        state:
          description:
            - Whether the peer section should be present or absent.
            - When C(absent), the peer section is removed.
            - Defaults to the module-wide O(state) when not set.
          type: str
          choices: [present, absent]
        section:
          description:
            - Peer section suffix, available as C(section) in the O(peer_id_tpl) template
              scope when deriving the peer section id.
          type: str
        proto:
          description:
            - Peer protocol; the peer section type becomes C(<proto>_<iface>).
            - Defaults to the module-wide O(proto), then the interface's C(proto), then
              C(wireguard) when not set.
          type: str
          choices: [wireguard, amneziawg]
        public_key:
          description:
            - Peer public key.
          type: str
          required: true
        preshared_key:
          description:
            - Peer pre-shared key (optional). Never generated by this module; it is
              supplied by the caller (resolved/shared by M(community.openwrt.wg_interface)).
          type: str
        description:
          description:
            - Peer description/label.
          type: str
        endpoint_host:
          description:
            - Peer endpoint host. Empty to omit (spoke does not dial).
          type: str
        endpoint_port:
          description:
            - Peer endpoint port.
          type: int
        persistent_keepalive:
          description:
            - Peer persistent keepalive interval. Empty to omit the option.
          type: int
        route_allowed_ips:
          description:
            - Whether to add routes for the peer's allowed IPs (OpenWrt C(route_allowed_ips)).
          type: str
          default: "0"
        allowed_ips:
          description:
            - List of allowed IPs/prefixes.
          type: list
          elements: str
          default: ['0.0.0.0/0', '::/0']
    peer_id_tpl:
      description:
        - Ucode template for the peer UCI section id.
        - Rendered with the C(iface_name), C(section) and C(proto) values in scope.
      type: str
      default: "{% if (section): %}peer_{{ iface_name }}_{{ section }}{% else %}peer_{{ iface_name }}{% endif %}"
  requirements:
    - C(ucode) and C(ucode-mod-uci) on the target.
  notes:
    - This module writes peer UCI sections only; it does not establish tunnels.
    - The peer section id is rendered from O(peer_id_tpl) and must match the id used by
      M(community.openwrt.wg_interface) when resolving pre-shared keys.
    - Template options (O(peer_id_tpl)) use ucode's native template engine (Jinja-style
      C({{ ... }}) / C({% ... %})).
  extends_documentation_fragment:
    - community.openwrt.attributes
  seealso:
    - module: community.openwrt.wg_interface
  author:
    - Vladimir Ermakov (@vooon)

EXAMPLES: |
  # Hub: write peer sections for two spokes on the wg0 interface
  - community.openwrt.wg_peer:
      peers:
        - iface: wg0
          section: spoke1
          public_key: "AFakeSpoke1PublicKey"
          preshared_key: "AFakeSpoke1Psk"
          endpoint_host: "spoke1.example.com"
          endpoint_port: 51820
          allowed_ips:
            - "10.8.0.2/32"
        - iface: wg0
          section: spoke2
          public_key: "AFakeSpoke2PublicKey"
          preshared_key: "AFakeSpoke2Psk"
          endpoint_host: "spoke2.example.com"
          endpoint_port: 51820
          allowed_ips:
            - "10.8.0.3/32"

  # Two independent p2p links: one peer per link interface (no section)
  - community.openwrt.wg_peer:
      peers:
        - iface: wg_l1
          public_key: "AFakeLink1PeerPublicKey"
          preshared_key: "AFakeLink1PeerPsk"
          endpoint_host: "link1-peer.example.com"
          endpoint_port: 51821
          allowed_ips:
            - "10.9.0.2/32"
        - iface: wg_l2
          public_key: "AFakeLink2PeerPublicKey"
          preshared_key: "AFakeLink2PeerPsk"
          endpoint_host: "link2-peer.example.com"
          endpoint_port: 51822
          allowed_ips:
            - "10.10.0.2/32"

RETURN:
  peers:
    description: Names of the (re)written peer sections.
    returned: always
    type: list
    elements: str
  removed:
    description: Names of peer sections removed because O(peers[].state) was C(absent).
    returned: when any peer state is absent
    type: list
    elements: str
  diff:
    description: List of before/after diffs (pre-shared keys redacted), one entry per changed peer section.
    returned: when diff mode and changes were detected
    type: list
    elements: dict
