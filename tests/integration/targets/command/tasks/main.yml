- name: "Run a simple command"
  community.openwrt.command:
    cmd: "echo test-123"
  register: cmd_out

- name: Assert stdout contains the expected text
  ansible.builtin.assert:
    that:
      - cmd_out.stdout is defined
      - cmd_out.stdout == "test-123"

- name: Run commands with distinct nonzero exit codes
  community.openwrt.command:
    cmd: "/bin/sh -c 'printf command-out; printf command-err >&2; exit {{ item }}'"
  loop: [1, 2, 7, 126, 127, 255]
  register: exit_codes
  ignore_errors: true

- name: Assert original exit codes and output streams are preserved
  ansible.builtin.assert:
    that:
      - item is failed
      - item.rc == item.item
      - item.stdout == 'command-out'
      - item.stderr == 'command-err'
  loop: "{{ exit_codes.results }}"

- name: Run a command with quoted and literal arguments
  community.openwrt.command:
    cmd: >-
      printf '%s\n' 'two words' "it's quoted" '$HOME; $(printf expanded) | *'
  register: quoted_args

- name: Assert argument boundaries and literal shell syntax are preserved
  ansible.builtin.assert:
    that:
      - quoted_args.rc == 0
      - quoted_args.stdout == "two words\nit's quoted\n$HOME; $(printf expanded) | *"
    fail_msg: "Unexpected command output: {{ quoted_args.stdout | to_json }}"

- name: Try running a nonexistent command
  community.openwrt.command:
    cmd: community-openwrt-command-does-not-exist
  register: missing_command
  ignore_errors: true

- name: Assert command-not-found status is preserved
  ansible.builtin.assert:
    that:
      - missing_command is failed
      - missing_command.rc == 127
      - missing_command.stdout == ''

- name: Reject invalid command arguments before execution
  community.openwrt.command:
    cmd: "{{ item.cmd }}"
  loop:
    - {cmd: "printf should-not-run 'unterminated", message: 'Unable to parse command arguments:'}
    - {cmd: 'printf should-not-run "unterminated', message: 'Unable to parse command arguments:'}
    - {cmd: '', message: 'No command was given'}
    - {cmd: '   ', message: 'No command was given'}
    - {cmd: "''", message: 'No command was given'}
  register: invalid_commands
  ignore_errors: true

- name: Assert preparation errors are distinct from command results
  ansible.builtin.assert:
    that:
      - item is failed
      - item is not changed
      # ansible-core may omit null return values from registered results.
      - item.get('rc') is none
      - item.msg.startswith(item.item.message)
      - item.stdout == ''
      - item.stderr == ''
      - item.start == ''
      - item.end == ''
      - item.delta == ''
  loop: "{{ invalid_commands.results }}"

- name: Skip argument preparation when file conditions prevent execution
  community.openwrt.command:
    cmd: "printf should-not-run 'unterminated"
    creates: "{{ item.creates | default(omit) }}"
    removes: "{{ item.removes | default(omit) }}"
  loop:
    - {creates: /etc/passwd}
    - {removes: /community-openwrt-command-does-not-exist}
  register: skipped_commands

- name: Assert file conditions take precedence over argument preparation
  ansible.builtin.assert:
    that:
      - item is not failed
      - item is not changed
      - item.rc == 0
      - item.stdout is match('skipped, since ')
  loop: "{{ skipped_commands.results }}"

- name: Let the shell report its own syntax errors
  community.openwrt.command:
    cmd: "printf should-not-run 'unterminated"
    uses_shell: true
  register: shell_error
  ignore_errors: true

- name: Assert shell errors are execution results
  ansible.builtin.assert:
    that:
      - shell_error is failed
      - shell_error is changed
      - shell_error.rc is not none
      - shell_error.rc != 0
      - shell_error.stdout == ''
      - shell_error.stderr != ''
      - shell_error.start != ''
      - shell_error.end != ''

- name: Include check-mode tasks
  ansible.builtin.include_tasks:
    file: check-mode.yml
