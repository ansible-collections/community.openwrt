- name: "Run a simple command"
  community.openwrt.command:
    cmd: "echo test-123"
  register: cmd_out

- name: Assert stdout contains the expected text
  ansible.builtin.assert:
    that:
      - cmd_out.stdout is defined
      - cmd_out.stdout == "test-123"

- name: Run commands with distinct nonzero exit codes
  community.openwrt.command:
    cmd: "/bin/sh -c 'printf command-out; printf command-err >&2; exit {{ item }}'"
  loop: [1, 2, 7, 255]
  register: exit_codes
  failed_when: false

- name: Assert original exit codes and output streams are preserved
  ansible.builtin.assert:
    that:
      - item.rc == item.item
      - item.stdout == 'command-out'
      - item.stderr == 'command-err'
  loop: "{{ exit_codes.results }}"

- name: Run a command with quoted and literal arguments
  community.openwrt.command:
    cmd: >-
      printf '%s\n' 'two words' "it's quoted" '$HOME; $(printf expanded) | *'
  register: quoted_args

- name: Assert argument boundaries and literal shell syntax are preserved
  ansible.builtin.assert:
    that:
      - quoted_args.rc == 0
      - quoted_args.stdout == "two words\nit's quoted\n$HOME; $(printf expanded) | *"
    fail_msg: "Unexpected command output: {{ quoted_args.stdout | to_json }}"

- name: Try running a nonexistent command
  community.openwrt.command:
    cmd: community-openwrt-command-does-not-exist
  register: missing_command
  failed_when: false

- name: Assert command-not-found status is preserved
  ansible.builtin.assert:
    that:
      - missing_command.rc == 127
      - missing_command.stdout == ''

- name: Reject unmatched quoting before running the command
  community.openwrt.command:
    cmd: "printf should-not-run 'unterminated"
  register: malformed_command
  failed_when: false

- name: Assert a splitting error does not execute the command
  ansible.builtin.assert:
    that:
      - malformed_command.rc != 0
      - malformed_command.stdout == ''
      - malformed_command.stderr != ''

- name: Include check-mode tasks
  ansible.builtin.include_tasks:
    file: check-mode.yml
