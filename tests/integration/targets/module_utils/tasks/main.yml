---
- name: Create directories for the module utils tests
  community.openwrt.file:
    path: "{{ remote_tmp_dir }}/{{ item }}"
    state: directory
  loop:
    - module_utils
    - scratch

- name: Copy the module utils under test
  community.openwrt.copy:
    src: "{{ role_path }}/../../../../plugins/module_utils/{{ item }}"
    dest: "{{ remote_tmp_dir }}/module_utils/{{ item }}"
  loop:
    - _basic.uc
    - _uci.uc

- name: Copy the test script
  community.openwrt.copy:
    src: test_uci.uc
    dest: "{{ remote_tmp_dir }}/test_uci.uc"

- name: Run the _uci test script
  community.openwrt.command:
    cmd: >-
      ucode -S -L {{ remote_tmp_dir }}/module_utils
      {{ remote_tmp_dir }}/test_uci.uc {{ remote_tmp_dir }}/scratch
  register: uci_utils_test
  failed_when: false

- name: Assert all _uci checks passed
  ansible.builtin.assert:
    that:
      - uci_utils_test.rc == 0
    fail_msg: "{{ uci_utils_test.stdout_lines + uci_utils_test.stderr_lines }}"
    success_msg: "{{ uci_utils_test.stdout_lines | last }}"
