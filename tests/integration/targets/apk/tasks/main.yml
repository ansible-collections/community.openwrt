---
- name: Initialize packaging system
  ansible.builtin.include_role:
    name: community.openwrt.init

- name: Run tests when package manager is apk
  when: openwrt_package_manager == "apk"
  block:
    - name: "Install a package (htop)"
      community.openwrt.apk:
        name: "htop"
        state: present
      register: apk_install

    - name: Assert package install succeeded
      ansible.builtin.assert:
        that:
          - apk_install is succeeded

    - name: "Verify package is installed"
      community.openwrt.command:
        cmd: apk info -e htop
      register: apk_verify
      failed_when: apk_verify.rc != 0

    - name: "Remove the package"
      community.openwrt.apk:
        name: "htop"
        state: absent
      register: apk_remove

    - name: Assert package removal succeeded
      ansible.builtin.assert:
        that:
          - apk_remove is succeeded

    - name: Install packages given as a comma-separated string with spaces
      community.openwrt.apk:
        name: "htop, tcpdump"
        state: present
      register: apk_install_csv

    - name: Verify packages are installed
      community.openwrt.command:
        cmd: "apk info -e {{ item }}"
      loop:
        - htop
        - tcpdump
      register: apk_verify_installed
      failed_when: apk_verify_installed.rc != 0

    - name: Install packages given as a list (idempotency)
      community.openwrt.apk:
        name:
          - htop
          - tcpdump
        state: present
      register: apk_install_list

    - name: Remove packages given as a list
      community.openwrt.apk:
        name:
          - htop
          - tcpdump
        state: absent
      register: apk_remove_list

    - name: Verify packages are removed
      community.openwrt.command:
        cmd: "apk info -e {{ item }}"
      loop:
        - htop
        - tcpdump
      register: apk_verify_removed
      failed_when: apk_verify_removed.rc == 0

    - name: Remove packages given as a comma-separated string with spaces (idempotency)
      community.openwrt.apk:
        name: "htop, tcpdump"
        state: absent
      register: apk_remove_csv

    - name: Assert list handling
      ansible.builtin.assert:
        that:
          - apk_install_csv is changed
          - apk_install_list is not changed
          - apk_remove_list is changed
          - apk_remove_csv is not changed

    - name: Test --allow-untrusted
      block:
        - name: Download a test package
          community.openwrt.command:
            cmd: 'apk fetch terminfo -o {{ remote_tmp_dir }}'
          register: apk_fetch_result

        - name: Set apk filename
          ansible.builtin.set_fact:
            apk_terminfo_filename: "{{ remote_tmp_dir }}/{{ apk_fetch_result.stdout_lines[0].split(' ')[1] }}.apk"

        - name: Output apk filename
          ansible.builtin.debug:
            var: apk_terminfo_filename

        - name: Install untrusted package
          community.openwrt.apk:
            name: "{{ apk_terminfo_filename }}"
            state: present
            allow_untrusted: true

        - name: "Verify package is installed"
          community.openwrt.command:
            cmd: apk info -e terminfo
          register: apk_verify_untrusted
          failed_when: apk_verify_untrusted.rc != 0
