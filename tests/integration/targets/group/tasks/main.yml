---
- name: ensure test groups are deleted before the test
  community.openwrt.group:
    name: '{{ item }}'
    state: absent
  loop:
    - ansibullgroup
    - ansibullgroup2
    - ansibullgroup3

- block:
    ##
    ## group add
    ##

    - name: create group (check mode)
      community.openwrt.group:
        name: ansibullgroup
        state: present
      register: create_group_check
      check_mode: true

    - name: get result of create group (check mode)
      ansible.builtin.raw: 'grep -E -v ^\# /etc/group | cut -d: -f1'
      register: create_group_actual_check

    - name: assert create group (check mode)
      ansible.builtin.assert:
        that:
          - create_group_check is changed
          - '"ansibullgroup" not in create_group_actual_check.stdout_lines'

    - name: create group
      community.openwrt.group:
        name: ansibullgroup
        state: present
      register: create_group

    - name: get result of create group
      ansible.builtin.raw: 'grep -E -v ^\# /etc/group | cut -d: -f1'
      register: create_group_actual

    - name: assert create group
      ansible.builtin.assert:
        that:
          - create_group is changed
          - create_group.gid is defined
          - '"ansibullgroup" in create_group_actual.stdout_lines'

    - name: create group (idempotent)
      community.openwrt.group:
        name: ansibullgroup
        state: present
      register: create_group_again

    - name: assert create group (idempotent)
      ansible.builtin.assert:
        that:
          - not create_group_again is changed

    ##
    ## group check
    ##

    - name: run existing group check tests
      community.openwrt.group:
        name: "{{ create_group_actual.stdout_lines|random }}"
        state: present
      with_sequence: start=1 end=5
      register: group_test1

    - name: validate results for testcase 1
      ansible.builtin.assert:
        that:
          - group_test1.results is defined
          - group_test1.results|length == 5

    - name: validate change results for testcase 1
      ansible.builtin.assert:
        that:
          - not group_test1 is changed

    ##
    ## group add with gid
    ##

    - name: create a group with a gid (check mode)
      community.openwrt.group:
        name: ansibullgroup2
        gid: 1234
        state: present
      register: create_group_gid_check
      check_mode: true

    - name: get result of create a group with a gid (check mode)
      ansible.builtin.raw: 'grep -E -v ^\# /etc/group | cut -d: -f1'
      register: create_group_gid_actual_check

    - name: assert create group with a gid (check mode)
      ansible.builtin.assert:
        that:
          - create_group_gid_check is changed
          - '"ansibullgroup2" not in create_group_gid_actual_check.stdout_lines'

    - name: create a group with a gid
      community.openwrt.group:
        name: ansibullgroup2
        gid: 1234
        state: present
      register: create_group_gid

    - name: get gid of created group
      ansible.builtin.raw: "grep ^ansibullgroup2: /etc/group | cut -d: -f3"
      register: create_group_gid_actual

    - name: assert create group with a gid
      ansible.builtin.assert:
        that:
          - create_group_gid is changed
          - create_group_gid.gid | int == 1234
          - create_group_gid_actual.stdout | trim | int == 1234

    - name: create a group with a gid (idempotent)
      community.openwrt.group:
        name: ansibullgroup2
        gid: 1234
        state: present
      register: create_group_gid_again

    - name: assert create group with a gid (idempotent)
      ansible.builtin.assert:
        that:
          - not create_group_gid_again is changed
          - create_group_gid_again.gid | int == 1234

    - name: create a group with a non-unique gid
      community.openwrt.group:
        name: ansibullgroup3
        gid: 1234
        non_unique: true
        state: present
      register: create_group_gid_non_unique

    - name: validate gid required with non_unique
      community.openwrt.group:
        name: foo
        non_unique: true
      register: missing_gid
      ignore_errors: true

    - name: assert create group with a non unique gid
      ansible.builtin.assert:
        that:
          - create_group_gid_non_unique is changed
          - create_group_gid_non_unique.gid | int == 1234
          - missing_gid is failed

    - name: request the gid a group already has, shared with another group
      community.openwrt.group:
        name: ansibullgroup2
        gid: 1234
        state: present
      register: same_gid_shared

    - name: get an existing group without a gid
      community.openwrt.group:
        name: ansibullgroup2
        state: present
      register: existing_group

    - name: assert existing group results
      ansible.builtin.assert:
        that:
          - same_gid_shared is not failed
          - same_gid_shared is not changed
          - existing_group is not changed
          - existing_group.gid == 1234
          - existing_group.system is false

    ##
    ## group change gid
    ##

    - block:
        - name: create user with primary group of ansibullgroup2
          community.openwrt.lineinfile:
            path: '/etc/passwd'
            line: 'gidchangeuser:x:2346:1234::/:/bin/false'
            state: present

        - name: change the gid of a group (check mode)
          community.openwrt.group:
            name: ansibullgroup2
            gid: 1235
            state: present
          register: change_gid_check
          check_mode: true

        - name: get gid of the group (check mode)
          ansible.builtin.raw: "grep ^ansibullgroup2: /etc/group | cut -d: -f3"
          register: change_gid_actual_check

        - name: assert change the gid of a group (check mode)
          ansible.builtin.assert:
            that:
              - change_gid_check is changed
              - change_gid_check.gid == 1235
              - change_gid_actual_check.stdout | trim | int == 1234

        - name: change the gid of a group
          community.openwrt.group:
            name: ansibullgroup2
            gid: 1235
            state: present
          register: change_gid

        - name: get gid of the group
          ansible.builtin.raw: "grep ^ansibullgroup2: /etc/group | cut -d: -f3"
          register: change_gid_actual

        - name: get primary gid of the user
          ansible.builtin.raw: "grep ^gidchangeuser: /etc/passwd | cut -d: -f4"
          register: change_gid_user

        - name: get gid of the group sharing the old gid
          ansible.builtin.raw: "grep ^ansibullgroup3: /etc/group | cut -d: -f3"
          register: change_gid_other

        - name: assert change the gid of a group
          ansible.builtin.assert:
            that:
              - change_gid is changed
              - change_gid.gid == 1235
              - change_gid_actual.stdout | trim | int == 1235
              - change_gid_user.stdout | trim | int == 1235
              - change_gid_other.stdout | trim | int == 1234

        - name: change the gid of a group (idempotent)
          community.openwrt.group:
            name: ansibullgroup2
            gid: 1235
            state: present
          register: change_gid_again

        - name: assert change the gid of a group (idempotent)
          ansible.builtin.assert:
            that:
              - change_gid_again is not changed

        - name: change the gid of a group to one already in use
          community.openwrt.group:
            name: ansibullgroup2
            gid: 1234
            state: present
          register: change_gid_clash
          ignore_errors: true

        - name: assert change the gid of a group to one already in use
          ansible.builtin.assert:
            that:
              - change_gid_clash is failed
              - change_gid_clash is not changed

      always:
        - name: cleanup user
          community.openwrt.lineinfile:
            path: '/etc/passwd'
            regex: '^gidchangeuser:'
            state: absent

    - name: use an invalid state
      community.openwrt.group:
        name: ansibullgroup
        state: installed
      register: invalid_state
      ignore_errors: true

    - name: assert invalid state
      ansible.builtin.assert:
        that:
          - invalid_state is failed

    - name: use an invalid group name
      community.openwrt.group:
        name: '{{ item }}'
        state: present
      loop:
        - ''
        - 'ansibull:x:0:'
        - "ansibull\nroot2:x:0:"
      register: invalid_name
      ignore_errors: true

    - name: get the groups after using invalid group names
      ansible.builtin.raw: 'grep -c ^ansibull: /etc/group; grep -c ^root2: /etc/group; grep -c ^: /etc/group; true'
      register: invalid_name_actual

    - name: assert invalid group name
      ansible.builtin.assert:
        that:
          - invalid_name.results | map(attribute='failed') is all
          - invalid_name_actual.stdout_lines | map('trim') | list == ['0', '0', '0']

    ##
    ## group remove
    ##

    - name: delete group (check mode)
      community.openwrt.group:
        name: ansibullgroup
        state: absent
      register: delete_group_check
      check_mode: true

    - name: get result of delete group (check mode)
      ansible.builtin.raw: 'grep -E -v ^\# /etc/group | cut -d: -f1'
      register: delete_group_actual_check

    - name: assert delete group (check mode)
      ansible.builtin.assert:
        that:
          - delete_group_check is changed
          - '"ansibullgroup" in delete_group_actual_check.stdout_lines'

    - name: delete group
      community.openwrt.group:
        name: ansibullgroup
        state: absent
      register: delete_group

    - name: get result of delete group
      ansible.builtin.raw: 'grep -E -v ^\# /etc/group | cut -d: -f1'
      register: delete_group_actual

    - name: assert delete group
      ansible.builtin.assert:
        that:
          - delete_group is changed
          - delete_group.gid is not defined
          - delete_group.system is not defined
          - '"ansibullgroup" not in delete_group_actual.stdout_lines'

    - name: delete group (idempotent)
      community.openwrt.group:
        name: ansibullgroup
        state: absent
      register: delete_group_again

    - name: assert delete group (idempotent)
      ansible.builtin.assert:
        that:
          - not delete_group_again is changed

    # https://github.com/ansible/ansible/pull/78172
    - block:
        - name: Create a group
          community.openwrt.group:
            name: groupdeltest
            gid: 2345
            state: present

        - name: Create user with primary group of groupdeltest
          community.openwrt.lineinfile:
            path: '/etc/passwd'
            line: 'groupdeluser:x:2345:2345::/:/bin/false'
            state: present

        - name: Show we can't delete the group usually
          community.openwrt.group:
            name: groupdeltest
            state: absent
          ignore_errors: true
          register: failed_delete

        - name: assert we couldn't delete the group
          ansible.builtin.assert:
            that:
              - failed_delete is failed
              - failed_delete is not changed

        - name: force delete the group
          community.openwrt.group:
            name: groupdeltest
            force: true
            state: absent

      always:
        - name: Cleanup user
          community.openwrt.lineinfile:
            path: '/etc/passwd'
            regex: 'groupdeluser:x:[0-9]+:[0-9]+::[^:]+:'
            state: absent

        - name: Cleanup group
          community.openwrt.group:
            name: groupdeltest
            state: absent

    # create system group

    - name: remove group
      community.openwrt.group:
        name: ansibullgroup
        state: absent

    - name: create system group
      community.openwrt.group:
        name: ansibullgroup
        state: present
        system: true

  always:
    - name: remove test groups after test
      community.openwrt.group:
        name: '{{ item }}'
        state: absent
      loop:
        - ansibullgroup
        - ansibullgroup2
        - ansibullgroup3
